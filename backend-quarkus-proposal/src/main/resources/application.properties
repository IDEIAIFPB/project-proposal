# -- DATABASE CONFIG --
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.url=${DATABASE_URL}

# -- HIBERNATE ORM --
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.datasource.jdbc.max-size=20

# -- CHARSET/ENCODING --
quarkus.http.encoding.enable=true
quarkus.http.encoding.charset=UTF-8

# -- JSON (Jackson) --
quarkus.jackson.date-format=yyyy-MM-dd
quarkus.jackson.time-zone=UTC

# -- LOGS --
quarkus.log.console.level=DEBUG
quarkus.log.level=INFO
